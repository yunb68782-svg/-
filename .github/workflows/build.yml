name: Build PaperEngine Ultra Realtime

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4

    - name: 配置 JDK 17 环境
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 配置 Gradle 8.4 环境
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    - name: 生成 PaperEngine 完整源码
      run: |
        python3 - << 'EOF'
        import os

        files = {}

        files['settings.gradle'] = """pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "PaperEngine"
        include ':app'
        """

        files['build.gradle'] = """plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        """

        files['gradle.properties'] = """org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        """

        files['app/build.gradle'] = """plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.example.paperengine'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.paperengine"
                minSdk 26
                targetSdk 34
                versionCode 8
                versionName "5.3.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = '17'
            }

            buildFeatures {
                viewBinding true
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
        }
        """

        files['app/src/main/AndroidManifest.xml'] = """<?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:icon="@drawable/ic_app_icon"
                android:label="@string/app_name"
                android:roundIcon="@drawable/ic_app_icon"
                android:supportsRtl="true"
                android:theme="@style/Theme.PaperEngine">
