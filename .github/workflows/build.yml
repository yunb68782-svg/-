                    WallpaperSettings.setOffsetX(this, 0.0f)
                    WallpaperSettings.setOffsetY(this, 0.0f)
                    WallpaperSettings.setRotation(this, 0)

                    binding.sbScale.progress = 50
                    binding.sbOffsetX.progress = 100
                    binding.sbOffsetY.progress = 100
                    binding.tvScaleValue.text = "100%"
                    binding.tvOffsetXValue.text = "居中"
                    binding.tvOffsetYValue.text = "居中"

                    updatePreviewMatrix()
                    Toast.makeText(this, "已一键恢复默认居中！", Toast.LENGTH_SHORT).show()
                }

                binding.btnPreset1.setOnClickListener { loadPreset("preset_matrix.mp4", "赛博矩阵 120F") }
                binding.btnPreset2.setOnClickListener { loadPreset("preset_neon.mp4", "霓虹几何 120F") }
                binding.btnPreset3.setOnClickListener { loadPreset("preset_quantum.mp4", "量子核心 120F") }
                binding.btnPreset4.setOnClickListener { loadPreset("preset_space.mp4", "深空视界 120F") }

                binding.switchMute.isChecked = !WallpaperSettings.isMuted(this)
                binding.switchMute.setOnCheckedChangeListener { _, soundEnabled ->
                    WallpaperSettings.setMuted(this, !soundEnabled)
                }
            }

            private fun updateOffsetXText(v: Float) {
                val p = (v * 100).toInt()
                binding.tvOffsetXValue.text = if (p == 0) "居中" else (if (p > 0) "右 " else "左 ") + kotlin.math.abs(p) + "%"
            }

            private fun updateOffsetYText(v: Float) {
                val p = (v * 100).toInt()
                binding.tvOffsetYValue.text = if (p == 0) "居中" else (if (p > 0) "上 " else "下 ") + kotlin.math.abs(p) + "%"
            }

            private fun loadPreset(assetName: String, label: String) {
                try {
                    val storageDir = File(filesDir, "wallpapers").apply { if (!exists()) mkdirs() }
                    val target = File(storageDir, assetName)

                    assets.open("presets/$assetName").use { input ->
                        FileOutputStream(target).use { output -> input.copyTo(output) }
                    }

                    WallpaperSettings.setWallpaperPath(this, target.absolutePath)
                    refreshStatus()
                    startPreviewPlayback()
                    Toast.makeText(this, "已装载：$label", Toast.LENGTH_SHORT).show()
                } catch (e: Exception) {
                    Log.e(TAG, "loadPreset failed: $assetName", e)
                    Toast.makeText(this, "预设载入失败，请确认资源完好。", Toast.LENGTH_SHORT).show()
                }
            }

            private fun handleImportedVideo(sourceUri: Uri) {
                try {
                    val storageDir = File(filesDir, "wallpapers").apply { if (!exists()) mkdirs() }
                    val targetFile = File(storageDir, "custom_wallpaper.mp4")

                    contentResolver.openInputStream(sourceUri)?.use { input ->
                        FileOutputStream(targetFile).use { output -> input.copyTo(output) }
                    } ?: throw IllegalStateException("Failed to read uri")

                    WallpaperSettings.setWallpaperPath(this, targetFile.absolutePath)
                    refreshStatus()
                    startPreviewPlayback()
                    Toast.makeText(this, "导入成功，已实时预览！", Toast.LENGTH_SHORT).show()
                } catch (e: Exception) {
                    Log.e(TAG, "handleImportedVideo failed", e)
                    Toast.makeText(this, "视频导入失败，请检查文件格式。", Toast.LENGTH_LONG).show()
                }
            }

            private fun refreshStatus() {
                val path = WallpaperSettings.getWallpaperPath(this)
                if (path.isNotBlank() && File(path).exists()) {
                    val file = File(path)
                    val sizeMb = file.length() / (1024 * 1024)
                    binding.tvCurrentWallpaper.text = "已载入：${file.name} (${sizeMb} MB)"
                    binding.tvCurrentWallpaper.setTextColor(resources.getColor(R.color.accent_cyan, null))
                } else {
                    binding.tvCurrentWallpaper.text = getString(R.string.no_wallpaper_selected)
                    binding.tvCurrentWallpaper.setTextColor(resources.getColor(R.color.text_secondary, null))
                }
            }
        }
        """

        for file_path, content in files.items():
            folder = os.path.dirname(file_path)
            if folder:
                os.makedirs(folder, exist_ok=True)
            with open(file_path, 'w', encoding='utf-8') as f:
                f.write(content.strip() + '\n')

        print("PaperEngine 极致修复版源码注入完毕！")
        EOF

    - name: 提交并推送源码到仓库
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "fix: resolve lifecycle resume bug, throttle prefs reading, optimize presets [skip ci]" || echo "No changes"
        git push || true

    - name: 生成 4 套极速轻量 120FPS 预设
      run: |
        mkdir -p app/src/main/assets/presets

        ffmpeg -y -f lavfi -i "testsrc2=s=1080x1920:r=120" -t 5 -c:v libx264 -crf 23 -preset veryfast -pix_fmt yuv420p app/src/main/assets/presets/preset_matrix.mp4
        ffmpeg -y -f lavfi -i "smptebars=s=1080x1920:r=120" -t 5 -c:v libx264 -crf 23 -preset veryfast -pix_fmt yuv420p app/src/main/assets/presets/preset_neon.mp4
        ffmpeg -y -f lavfi -i "testsrc=s=1080x1920:r=120" -t 5 -c:v libx264 -crf 23 -preset veryfast -pix_fmt yuv420p app/src/main/assets/presets/preset_quantum.mp4
        ffmpeg -y -f lavfi -i "smptehdbars=s=1080x1920:r=120" -t 5 -c:v libx264 -crf 23 -preset veryfast -pix_fmt yuv420p app/src/main/assets/presets/preset_space.mp4

        ls -lh app/src/main/assets/presets/

    - name: 编译 APK 安装包
      run: |
        gradle assembleDebug --no-daemon --stacktrace

    - name: 导出 APK 安装包
      uses: actions/upload-artifact@v4
      with:
