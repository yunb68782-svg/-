            override fun onSurfaceTextureUpdated(surface: SurfaceTexture) {}

            private fun startPreviewPlayback() {
                val path = WallpaperSettings.getWallpaperPath(this)
                if (!isTextureReady || path.isBlank() || !File(path).exists() || previewSurface == null) {
                    binding.tvPreviewPlaceholder.visibility = View.VISIBLE
                    return
                }

                binding.tvPreviewPlaceholder.visibility = View.GONE
                stopPreviewPlayback()

                try {
                    previewPlayer = MediaPlayer().apply {
                        setSurface(previewSurface)
                        setDataSource(path)
                        isLooping = true
                        setVolume(0f, 0f)

                        setOnPreparedListener { mp ->
                            try {
                                mp.start()
                                updatePreviewMatrix()
                            } catch (e: Exception) {
                                Log.e(TAG, "Preview start error", e)
                            }
                        }
