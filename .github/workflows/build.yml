            }

            private fun updatePreviewMatrix() {
                val viewWidth = binding.previewTextureView.width.toFloat()
                val viewHeight = binding.previewTextureView.height.toFloat()
                if (viewWidth <= 0f || viewHeight <= 0f) return

                val scale = WallpaperSettings.getScale(this)
                val offX = WallpaperSettings.getOffsetX(this) * (viewWidth / 2f)
                val offY = -WallpaperSettings.getOffsetY(this) * (viewHeight / 2f)
                val rot = WallpaperSettings.getRotation(this).toFloat()

                val matrix = Matrix()
                matrix.postScale(scale, scale, viewWidth / 2f, viewHeight / 2f)
                matrix.postRotate(rot, viewWidth / 2f, viewHeight / 2f)
                matrix.postTranslate(offX, offY)

                binding.previewTextureView.setTransform(matrix)
            }

            private fun setupUI() {
